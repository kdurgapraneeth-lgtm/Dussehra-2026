<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
  <!--Icons-->
  <link rel="stylesheet" 
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=arrow_back_ios" />
  <!--Linking styles to the file-->
  <link rel="stylesheet" href="StyleSheets/SignUp/header.css">
  <link rel="stylesheet" href="StyleSheets/SignUp/mainContainer.css">
</head>
<body>
  <!--Top section-->
  <div class="head_container">
    <!--Back arrow button-->
    <a href="index.html">
      <button class="back_btn_container">
        <span class="material-symbols-outlined" id="back_btn">
          arrow_back_ios
        </span>
      </button>
    </a>

    <!--Sign Up name-->
    <h4 id="sign_heading">Sign up</h4>
  </div>

  <!--User details section-->
  <div class="user_details">
    <!--Name question tag and input field & error massage-->
    <p class="promt_tags">What's your name?</p>
    <input 
      type="text" 
      maxlength="16"
      placeholder="eg: praneeth" 
      class="input_box  js-name-field"
    >
    <p class="error_message js-error-name"></p>
    <!--Password tag and input field & error massage-->
    <p class="promt_tags">Password</p>
    <input 
      type="text"
      maxlength="14"
      placeholder="eg: 1234********" 
      class="input_box js-password-field"
    >
    <p class="error_message js-error-password"></p>
  </div>

  <!--Done button-->
  
  <div class="button_container">
    <button id="done_btn">Done</button>
  </div>

  <!--JavaScript-->
  <script src="javaScript/SignUp/signUp.js"></script>

</body>
</html>

<!--END-->
