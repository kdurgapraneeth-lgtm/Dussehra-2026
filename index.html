<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dussehra2026</title>
  <!-- Load the Material Symbols stylesheet once -->
  <link rel="stylesheet" 
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!--Linking styles to the file-->
  <link rel="stylesheet" href="StyleSheets/Home/header.css">
  <link rel="stylesheet" href="StyleSheets/Home/menu.css">
  <link rel="stylesheet" href="StyleSheets/Home/buttons.css">
  <link rel="stylesheet" href="StyleSheets/Home/postingBox.css">
  <link rel="stylesheet" href="StyleSheets/Home/Render.css">
</head>
<body>
  <!--Header section-->
  <div class="successMessage js-success-message">
    <p id="successText">posted successfully</p>
    <span class="material-symbols-outlined doneBtn">
    check_circle
    </span>
  </div>
  <div class="header_section">
    <h4 id="app_name">Money flow</h4>
    <!--Menu icon-->
    <button class="menu-btn js-menu-btn">
      <span class="material-symbols-outlined" id="sub_menu_btn">
        menu
      </span>
    </button>
  </div>

  <!--Sign up button-->
  <a href="signUp.html">
    <button id="sign_btn" class="js-sign-btn">Sign up</button>
  </a>

  <!--Side menu-->
  <div class="menu_container js-side-menu">
    <!--Close button-->
    <span class="material-symbols-outlined js-closeMenu" id="close_btn">
      close
    </span>
    <!--Content-->
    <p id="fliter_text">Calculations</p><hr id="line">
    <button class="menu_item js-income-btn">Total income</button>
    <button class="menu_item js-expense-btn">Total expense</button>
    <button class="menu_item js-remaining-btn" id="remaining">Remaining amount</button>
    <button 
      class="menu_item"
      onclick="localStorage.clear(); 
      window.location.href='signup.html';"
      style="color: red; margin-top: 64px;"
    >
      Logout
    </button>
  </div>
  <!--Dialog box for totals-->
  <div class="totals_dialog_container js-dialog-box">
    <!--Close button-->
    <span class="material-symbols-outlined" id="close_btn2">
      close
    </span>
    <!--Content-->
    <h3 class="js-total-text"></h3>       <!--Text is changeble-->
    <h2 class="js-totals">+ ₹0</h2>                <!--Amount is changeble-->
  </div>

  <!--RENDERING SECTION-->  
  <!--Remaining container-->
  <div class="date_container">
    <h4 id="day_remaining">₹0</h4>       <!--Amount is changeble-->
  </div>

  <!--Main content-->
  <div id="card_container">
    <!-- Dynamic cards generated by renderPost() will load here -->
  </div>

  <!--posting box-->
  <div class="post_container js-post_container">
    <!--Post icon-->
    <button 
      class="material-symbols-outlined" 
      id="send_btn"
    >
        send
    </button>
    <!--input field-->
    <input 
      type="text" 
      maxlength="24"
      placeholder="purpose" 
      class="input_fields js-input-fields" 
      id="field1"
    >
    <div class="amount_and_toggle">
      <!--input field-->
      <input inputmode="numeric"
        maxlength="6"
        id="test_ele"
        placeholder="amount"
        class="input_fields js-input-fields"
      >
      <!--toggle-->
      <button class="toggle js-click-toggle">
        +       <!--Toggle is changeble-->
      </button>
    </div>
  </div>

  <!--Delete post-->
  <div class="totals_dialog_container js-delete-post" id="delete_edit_container">
    <!--Close button-->
    <span class="material-symbols-outlined js-delete-close" id="close_btn2">
      close
    </span>
    <p style="font-size: 12px; margin-bottom: 12px;">Are you sure to delete?</p>
    <button id="delete_btn">delete</button>
  </div>

  <!--JavaScript-->
  <script type="module" src="javaScript/Home/returnHome.js"></script>
  <script type="module" src="javaScript/Home/addBtn.js"></script>
  <script type="module" src="javaScript/Home/menu.js"></script>
  <script type="module" src="javaScript/Home/posting.js"></script>
  <script type="module" src="javaScript/Home/deletePost.js"></script>

</body>
</html>

<!--END-->
